services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis-insight:
    image: redislabs/redisinsight:latest
    ports:
      - "5540:5540"
    environment:
      - RI_PROXY_PATH=/insight
    networks:
      - app-network

networks:
  app-network:
    external: true
