version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: aegis_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

networks:
  app-network:
    external: true
