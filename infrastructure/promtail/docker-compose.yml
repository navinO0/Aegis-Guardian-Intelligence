services:
  promtail:
    image: grafana/promtail:latest
    container_name: aegis_promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - ../logs:/mnt/logs
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app-network
    restart: always

networks:
  app-network:
    external: true
