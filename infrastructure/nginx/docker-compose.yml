version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    container_name: docu_guardian_gateway
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    restart: always

networks:
  app-network:
    external: true
